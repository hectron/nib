name: Cut release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the release commit
        id: version
        run: |
          version=$(awk '
            $0 == "[package]" { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^version = "[^"]+"/ {
              sub(/^version = "/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Cargo.toml does not contain a releasable version: ${version:-none}" >&2
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists." >&2
            exit 1
          fi

          subject=$(git log -1 --format=%s)
          expected="chore(release): $tag"
          if [ "$subject" != "$expected" ]; then
            escaped_version=${version//./\\.}
            if ! grep -Eq "^## \\[$escaped_version\\]( - .+)?$" CHANGELOG.md; then
              echo "HEAD is not '$expected', and CHANGELOG.md has no section for $version." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged v$VERSION at $GITHUB_SHA"

      - name: Start the release build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
          echo "Started the release build for v$VERSION: https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
