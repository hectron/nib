[package]
name = "nib"
version = "0.1.0"
edition = "2024"
description = "Fast CLI for Apple Notes, Reminders, and Calendar"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
jiff = { version = "0.2.38", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
