[package]
name = "nib"
version = "0.1.0"
edition = "2024"
description = "Fast CLI for Apple Notes, Reminders, and Calendar"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
jiff = { version = "0.2.38", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-normalization = "0.1.26"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
proptest = "1.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKReminder", "EKTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSCalendar", "NSDate", "NSEnumerator", "NSError", "NSPredicate", "NSString", "NSURL"] }
